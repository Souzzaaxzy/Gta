name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar, testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Confirms the emulator binaries are present, uncorrupted, and still expose the
      # entry points the adapter calls. Runs before the build so a broken core fails fast.
      - name: Verificar o núcleo do emulador
        run: npm run verify:emulator

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

      # Fails if the build is missing the cross-origin isolation headers, the service
      # worker, or the emulator core, or if it contains a forbidden file.
      - name: Verificar o build
        run: npm run verify:dist

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the production build served with the real COOP/COEP headers, so the
      # emulator core really instantiates and really streams a disc through the page.
      - name: Executar os testes de navegador
        run: npm run test:e2e

      - name: Guardar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
